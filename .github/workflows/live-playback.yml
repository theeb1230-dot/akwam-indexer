name: Live Playback Validation

on:
  push:
    branches:
      - "phase-2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lucky-live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Lucky E1-E7 and capture evidence
        env:
          LIVE_REPORT_PATH: artifacts/live-playback/report.json
        run: npm run live:test

      - name: Enforce semantic E1-E7 playback matrix
        if: always()
        run: npm run gate:live-matrix -- artifacts/live-playback/report.json

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-playback-evidence
          path: artifacts/live-playback/
          if-no-files-found: error
          retention-days: 14
