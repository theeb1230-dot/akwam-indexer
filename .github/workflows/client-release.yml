name: Client Release Artifacts

on:
  push:
    branches: [main]
    paths:
      - "release/trigger.json"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public production HTTPS API base URL
        required: true
        type: string
      release_level:
        description: Release classification requested for this triplet
        required: true
        type: choice
        options:
          - experimental
          - beta
          - golden
          - complete
      release_tag:
        description: Optional GitHub release tag
        required: false
        type: string

permissions:
  contents: write

env:
  THEEB_INSTALLABLE_API_BASE_URL: ${{ inputs.api_base_url || 'https://theeb-arab-api.onrender.com' }}
  THEEB_RELEASE_LEVEL: ${{ inputs.release_level || 'experimental' }}
  THEEB_RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.1-experimental.1' }}

jobs:
  validate-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Use Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - name: Install and test repository before release
        run: npm ci && npm test
      - name: Reject placeholders in application-owned source
        run: |
          if grep -R -n -F -e 'https://example.invalid/' -e 'https://example.com/' -e 'http://127.0.0.1' -e 'https://127.0.0.1' -e 'http://localhost' -e 'https://localhost' -e 'http://0.0.0.0' -e 'https://0.0.0.0' clients/dart/lib clients/dart/tool clients/flutter/lib --exclude-dir=build; then
            echo "PLACEHOLDER_FOUND_IN_APPLICATION_SOURCE"
            exit 1
          fi
      - name: Validate public API readiness and unauthenticated search
        run: node scripts/validate-installable-api-url.js
      - name: Run real Dart client search smoke
        env:
          THEEB_API_BASE_URL: ${{ env.THEEB_INSTALLABLE_API_BASE_URL }}
        run: dart clients/dart/tool/remote_smoke.dart

  android:
    needs: validate-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        working-directory: clients/flutter
        run: flutter create --platforms=android --org com.theebarab --project-name theeb_arab .
      - name: Get Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get
      - name: Analyze and test
        working-directory: clients/flutter
        run: flutter analyze && flutter test
      - name: Build installable Android APK
        working-directory: clients/flutter
        run: flutter build apk --debug --dart-define=THEEB_API_BASE_URL="$THEEB_INSTALLABLE_API_BASE_URL" --dart-define=THEEB_INSTALLABLE_BUILD=true
      - name: Validate Android artifact contents
        run: |
          rm -rf /tmp/theeb-apk && mkdir -p /tmp/theeb-apk
          unzip -qq clients/flutter/build/app/outputs/flutter-apk/app-debug.apk -d /tmp/theeb-apk
          if grep -R -a -F -e 'https://example.invalid/' /tmp/theeb-apk; then
            echo "PLACEHOLDER_FOUND_IN_ANDROID_ARTIFACT"
            exit 1
          fi
          grep -R -a -F "$THEEB_INSTALLABLE_API_BASE_URL" /tmp/theeb-apk >/dev/null || {
            echo "CONFIGURED_API_NOT_FOUND_IN_ANDROID_ARTIFACT"
            exit 1
          }
      - name: Verify Android package identity, version and signature
        working-directory: clients/flutter
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          EXPECTED_ID="$(grep -E 'applicationId = "' android/app/build.gradle.kts | head -1 | sed -E 's/.*applicationId = "([^"]+)".*/\1/')"
          EXPECTED_VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          EXPECTED_NAME="${EXPECTED_VERSION%%+*}"
          EXPECTED_CODE="${EXPECTED_VERSION##*+}"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKANALYZER"
          test -x "$APKSIGNER"
          ACTUAL_ID="$("$APKANALYZER" manifest application-id "$APK")"
          ACTUAL_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          ACTUAL_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          test -n "$EXPECTED_ID"
          test "$ACTUAL_ID" = "$EXPECTED_ID"
          test "$ACTUAL_NAME" = "$EXPECTED_NAME"
          test "$ACTUAL_CODE" = "$EXPECTED_CODE"
          "$APKSIGNER" verify "$APK"
          node -e 'const fs=require("fs"); const d={platform:"android-mobile",application_id:process.argv[1],version_name:process.argv[2],version_code:process.argv[3],signature_verified:true,commit_sha:process.env.GITHUB_SHA}; fs.writeFileSync("build/android-mobile-metadata.json",JSON.stringify(d,null,2)+"\n");' "$ACTUAL_ID" "$ACTUAL_NAME" "$ACTUAL_CODE"
      - name: Stage Android artifact
        run: cp clients/flutter/build/app/outputs/flutter-apk/app-debug.apk theeb-arab-android.apk
      - name: Upload Android metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theeb-arab-android-metadata
          path: clients/flutter/build/android-mobile-metadata.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theeb-arab-android
          path: theeb-arab-android.apk
          if-no-files-found: error
          retention-days: 14

  android-tv:
    needs: validate-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        working-directory: clients/flutter
        run: flutter create --platforms=android --org com.theebarab --project-name theeb_arab .
      - name: Configure Android TV manifest
        working-directory: clients/flutter
        run: dart run tool/configure_android_tv.dart
      - name: Get Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get
      - name: Analyze and test
        working-directory: clients/flutter
        run: flutter analyze && flutter test
      - name: Build installable Android TV APK
        working-directory: clients/flutter
        run: flutter build apk --debug --dart-define=THEEB_API_BASE_URL="$THEEB_INSTALLABLE_API_BASE_URL" --dart-define=THEEB_INSTALLABLE_BUILD=true --dart-define=THEEB_TARGET=tv
      - name: Validate Android TV artifact contents
        run: |
          rm -rf /tmp/theeb-tv-apk && mkdir -p /tmp/theeb-tv-apk
          unzip -qq clients/flutter/build/app/outputs/flutter-apk/app-debug.apk -d /tmp/theeb-tv-apk
          if grep -R -a -F -e 'https://example.invalid/' /tmp/theeb-tv-apk; then
            echo "PLACEHOLDER_FOUND_IN_ANDROID_TV_ARTIFACT"
            exit 1
          fi
          grep -R -a -F "$THEEB_INSTALLABLE_API_BASE_URL" /tmp/theeb-tv-apk >/dev/null || {
            echo "CONFIGURED_API_NOT_FOUND_IN_ANDROID_TV_ARTIFACT"
            exit 1
          }
      - name: Verify Android TV package identity, version, signature and TV manifest
        working-directory: clients/flutter
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          EXPECTED_ID="$(grep -E 'applicationId = "' android/app/build.gradle.kts | head -1 | sed -E 's/.*applicationId = "([^"]+)".*/\1/')"
          EXPECTED_VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          EXPECTED_NAME="${EXPECTED_VERSION%%+*}"
          EXPECTED_CODE="${EXPECTED_VERSION##*+}"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKANALYZER"
          test -x "$APKSIGNER"
          ACTUAL_ID="$("$APKANALYZER" manifest application-id "$APK")"
          ACTUAL_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          ACTUAL_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          MANIFEST="$("$APKANALYZER" manifest print "$APK")"
          test -n "$EXPECTED_ID"
          test "$ACTUAL_ID" = "$EXPECTED_ID"
          test "$ACTUAL_NAME" = "$EXPECTED_NAME"
          test "$ACTUAL_CODE" = "$EXPECTED_CODE"
          printf '%s' "$MANIFEST" | grep -F 'android.software.leanback'
          printf '%s' "$MANIFEST" | grep -F 'android.hardware.touchscreen'
          printf '%s' "$MANIFEST" | grep -F 'android.intent.category.LEANBACK_LAUNCHER'
          printf '%s' "$MANIFEST" | grep -F 'android:screenOrientation'
          printf '%s' "$MANIFEST" | grep -F 'android:banner='
          "$APKSIGNER" verify "$APK"
          node -e 'const fs=require("fs"); const d={platform:"android-tv",application_id:process.argv[1],version_name:process.argv[2],version_code:process.argv[3],signature_verified:true,leanback_verified:true,commit_sha:process.env.GITHUB_SHA}; fs.writeFileSync("build/android-tv-metadata.json",JSON.stringify(d,null,2)+"\n");' "$ACTUAL_ID" "$ACTUAL_NAME" "$ACTUAL_CODE"
      - name: Stage Android TV artifact
        run: cp clients/flutter/build/app/outputs/flutter-apk/app-debug.apk theeb-arab-android-tv.apk
      - name: Upload Android TV metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theeb-arab-android-tv-metadata
          path: clients/flutter/build/android-tv-metadata.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android TV artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theeb-arab-android-tv
          path: theeb-arab-android-tv.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: validate-api
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform scaffold
        working-directory: clients/flutter
        run: flutter create --platforms=ios --org com.theebarab --project-name theeb_arab .
      - name: Get Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get
      - name: Analyze and test
        working-directory: clients/flutter
        run: flutter analyze && flutter test
      - name: Build unsigned installable iOS app
        working-directory: clients/flutter
        run: flutter build ios --release --no-codesign --dart-define=THEEB_API_BASE_URL="$THEEB_INSTALLABLE_API_BASE_URL" --dart-define=THEEB_INSTALLABLE_BUILD=true --dart-define=THEEB_TARGET=ios
      - name: Package unsigned IPA
        working-directory: clients/flutter
        run: |
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -qry ../theeb-arab-ios-unsigned.ipa Payload
      - name: Validate iOS artifact contents
        run: |
          rm -rf /tmp/theeb-ipa && mkdir -p /tmp/theeb-ipa
          unzip -qq clients/flutter/build/ios/theeb-arab-ios-unsigned.ipa -d /tmp/theeb-ipa
          if grep -R -a -F -e 'https://example.invalid/' /tmp/theeb-ipa; then
            echo "PLACEHOLDER_FOUND_IN_IOS_ARTIFACT"
            exit 1
          fi
          grep -R -a -F "$THEEB_INSTALLABLE_API_BASE_URL" /tmp/theeb-ipa >/dev/null || {
            echo "CONFIGURED_API_NOT_FOUND_IN_IOS_ARTIFACT"
            exit 1
          }
      - name: Verify iOS bundle identity, version and unsigned IPA structure
        working-directory: clients/flutter
        run: |
          IPA="build/ios/theeb-arab-ios-unsigned.ipa"
          rm -rf /tmp/theeb-ios-identity && mkdir -p /tmp/theeb-ios-identity
          unzip -qq "$IPA" -d /tmp/theeb-ios-identity
          APP_COUNT="$(find /tmp/theeb-ios-identity/Payload -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          test "$APP_COUNT" = "1"
          APP="$(find /tmp/theeb-ios-identity/Payload -maxdepth 1 -type d -name '*.app' | head -1)"
          INFO="$APP/Info.plist"
          test -f "$INFO"
          EXPECTED_ID="com.theebarab.theebArab"
          EXPECTED_VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          EXPECTED_NAME="${EXPECTED_VERSION%%+*}"
          EXPECTED_CODE="${EXPECTED_VERSION##*+}"
          ACTUAL_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          ACTUAL_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")"
          ACTUAL_CODE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")"
          printf 'Expected bundle=%s version=%s build=%s\n' "$EXPECTED_ID" "$EXPECTED_NAME" "$EXPECTED_CODE"
          printf 'Actual   bundle=%s version=%s build=%s\n' "$ACTUAL_ID" "$ACTUAL_NAME" "$ACTUAL_CODE"
          test -n "$EXPECTED_ID"
          test "$ACTUAL_ID" = "$EXPECTED_ID"
          test "$ACTUAL_NAME" = "$EXPECTED_NAME"
          test "$ACTUAL_CODE" = "$EXPECTED_CODE"
          test ! -f "$APP/embedded.mobileprovision"
          SIGNING_STATE="UNSIGNED"
          if codesign -dv "$APP" >/dev/null 2>&1; then
            AUTHORITY="$(codesign -dvv "$APP" 2>&1 | awk -F= '/^Authority=/{print $2; exit}')"
            if [ -n "$AUTHORITY" ]; then
              echo "IOS_IPA_HAS_DISTRIBUTION_IDENTITY"
              exit 1
            fi
            SIGNING_STATE="ADHOC"
          fi
          node -e 'const fs=require("fs"); const d={platform:"ios",bundle_id:process.argv[1],version_name:process.argv[2],version_code:process.argv[3],signing:process.argv[4],payload_app_count:1,commit_sha:process.env.GITHUB_SHA}; fs.writeFileSync("build/ios/ios-metadata.json",JSON.stringify(d,null,2)+"\n");' "$ACTUAL_ID" "$ACTUAL_NAME" "$ACTUAL_CODE" "$SIGNING_STATE"
      - name: Stage iOS artifact
        run: cp clients/flutter/build/ios/theeb-arab-ios-unsigned.ipa theeb-arab-ios-unsigned.ipa
      - name: Upload iOS metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theeb-arab-ios-metadata
          path: clients/flutter/build/ios/ios-metadata.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload iOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theeb-arab-ios-unsigned
          path: theeb-arab-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  release-readiness:
    needs: [android, android-tv, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout readiness policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download Android artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theeb-arab-android
          path: release
      - name: Download Android TV artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theeb-arab-android-tv
          path: release
      - name: Download iOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theeb-arab-ios-unsigned
          path: release
      - name: Download Android metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theeb-arab-android-metadata
          path: metadata
      - name: Download Android TV metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theeb-arab-android-tv-metadata
          path: metadata
      - name: Download iOS metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theeb-arab-ios-metadata
          path: metadata
      - name: Validate cross-platform identity and version parity
        run: node scripts/validate-client-artifact-metadata.js metadata
      - name: Require exact artifact triplet and supported classification
        env:
          RELEASE_LEVEL: ${{ env.THEEB_RELEASE_LEVEL }}
        run: |
          test -s release/theeb-arab-android.apk
          test -s release/theeb-arab-android-tv.apk
          test -s release/theeb-arab-ios-unsigned.ipa
          for required in             release/theeb-arab-android.apk             release/theeb-arab-android-tv.apk             release/theeb-arab-ios-unsigned.ipa; do
            test -f "$required"
          done
          if [ "$RELEASE_LEVEL" != "experimental" ]; then
            echo "CURRENT_WORKFLOW_ONLY_SUPPORTS_EXPERIMENTAL_UNSIGNED_IOS"
            exit 1
          fi
      - name: Generate checksums and release manifest
        env:
          RELEASE_LEVEL: ${{ env.THEEB_RELEASE_LEVEL }}
        run: |
          cd release
          sha256sum theeb-arab-android.apk theeb-arab-android-tv.apk theeb-arab-ios-unsigned.ipa > SHA256SUMS.txt
          node -e 'const fs=require("fs"); const manifest={schema_version:1,release_level:process.env.RELEASE_LEVEL,commit_sha:process.env.GITHUB_SHA,artifacts:["theeb-arab-android.apk","theeb-arab-android-tv.apk","theeb-arab-ios-unsigned.ipa"],metadata:["android-mobile-metadata.json","android-tv-metadata.json","ios-metadata.json"],ios_signing:"UNSIGNED_OR_ADHOC",generated_at:new Date().toISOString()}; fs.writeFileSync("release-manifest.json",JSON.stringify(manifest,null,2)+"\\n");'
      - name: Materialize runtime Experimental release evidence
        run: node scripts/create-experimental-release-evidence.js release metadata
      - name: Validate runtime Experimental readiness
        run: node -e 'const fs=require("fs"); const {validateReleaseLevel}=require("./scripts/validate-release-readiness"); validateReleaseLevel("experimental",JSON.parse(fs.readFileSync("release/runtime-release-readiness.json","utf8")));'
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theeb-arab-release-evidence
          path: |
            release/SHA256SUMS.txt
            release/release-manifest.json
            release/runtime-release-readiness.json
            metadata/*.json
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: [release-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theeb-arab-android
          path: release
      - name: Download Android TV artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theeb-arab-android-tv
          path: release
      - name: Download iOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theeb-arab-ios-unsigned
          path: release
      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: theeb-arab-release-evidence
          path: release
      - name: Publish verified client release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ env.THEEB_RELEASE_TAG }}
          RELEASE_LEVEL: ${{ env.THEEB_RELEASE_LEVEL }}
        run: |
          TAG="${RELEASE_TAG_INPUT:-experimental-${GITHUB_RUN_NUMBER}}"
          EVIDENCE_DIR="release/release"
          test -s release/theeb-arab-android.apk
          test -s release/theeb-arab-android-tv.apk
          test -s release/theeb-arab-ios-unsigned.ipa
          test -s "$EVIDENCE_DIR/SHA256SUMS.txt"
          test -s "$EVIDENCE_DIR/release-manifest.json"
          test -s "$EVIDENCE_DIR/runtime-release-readiness.json"
          gh release create "$TAG" \
            release/theeb-arab-android.apk \
            release/theeb-arab-android-tv.apk \
            release/theeb-arab-ios-unsigned.ipa \
            "$EVIDENCE_DIR/SHA256SUMS.txt" \
            "$EVIDENCE_DIR/release-manifest.json" \
            "$EVIDENCE_DIR/runtime-release-readiness.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ذيب العرب - Experimental - $TAG" \
            --notes "Classification: Experimental. Commit: $GITHUB_SHA. API: $THEEB_INSTALLABLE_API_BASE_URL. API readiness and real Dart Search smoke passed before build. Android Mobile APK + Android TV APK + iOS IPA were produced from this workflow. The iOS IPA is UNSIGNED/ADHOC and is not directly installable without external signing. SHA-256 checksums and release manifest are attached."
