name: Phase 3 Provider Recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  akwam-tls-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose Akwam TLS without bypassing media validation
        run: node scripts/akwam-tls-diagnostic.js

  wecima-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        episode: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Lucky episode in Chromium
        env:
          EPISODE: ${{ matrix.episode }}
        shell: bash
        run: |
          set +e
          node scripts/wecima-browser-probe.js 2>&1 | tee /tmp/theeb-browser-probe.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q 'CHROME_START_TIMEOUT' /tmp/theeb-browser-probe.log; then
            echo "Chromium startup timed out; retrying startup once without relaxing playback verification."
            sleep 2
            node scripts/wecima-browser-probe.js
            exit $?
          fi
          exit "$status"

  web-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke test Theeb Arab PWA in Chromium
        run: npm run test:web-browser

  resolver-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Trace Lucky playback resolution
        run: npm run live:test
