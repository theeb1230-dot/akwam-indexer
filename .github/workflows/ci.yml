name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --target api --tag theeb-engine:ci .

      - name: Build worker image
        run: docker build --target worker --tag theeb-worker:ci .

      - name: Build migration image
        run: docker build --target migration --tag theeb-migration:ci .

  golden-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: theeb_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d theeb_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run bounded offline golden gates
        env:
          GATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/theeb_gate
          GATE_TIMEOUT_MS: 60000
          GATE_LOAD_OPERATIONS: 2000
          GATE_LOAD_CONCURRENCY: 25
          GATE_SOAK_CYCLES: 10000
        run: npm run gate:golden
      - name: Upload golden gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-gate-report
          path: artifacts/golden-gates/
          if-no-files-found: error
          retention-days: 14

  dart-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Dart
        uses: dart-lang/setup-dart@v1
      - name: Analyze client contract
        run: dart analyze clients/dart/lib/theeb_api_contract.dart clients/dart/test/theeb_api_contract_test.dart
      - name: Run client contract tests
        run: dart clients/dart/test/theeb_api_contract_test.dart
      - name: Analyze mobile foundation
        run: dart analyze clients/dart/lib/http_theeb_transport.dart clients/dart/lib/theeb_client_config.dart clients/dart/lib/theeb_brand.dart clients/dart/test/mobile_foundation_test.dart
      - name: Run mobile foundation tests
        run: dart clients/dart/test/mobile_foundation_test.dart

  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        working-directory: clients/flutter
        run: flutter create --platforms=android --org com.theebarab --project-name theeb_arab .
      - name: Get Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: clients/flutter
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: clients/flutter
        run: flutter test
      - name: Build Android debug APK
        working-directory: clients/flutter
        run: flutter build apk --debug --dart-define=THEEB_API_BASE_URL=https://example.invalid/
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: theeb-arab-android-debug
          path: clients/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7


  flutter-android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        working-directory: clients/flutter
        run: flutter create --platforms=android --org com.theebarab --project-name theeb_arab .
      - name: Configure Android TV manifest
        run: node scripts/configure-android-tv.js
      - name: Get Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: clients/flutter
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: clients/flutter
        run: flutter test
      - name: Build Android TV debug APK
        working-directory: clients/flutter
        run: flutter build apk --debug --dart-define=THEEB_TARGET=tv --dart-define=THEEB_API_BASE_URL=https://example.invalid/
      - name: Upload Android TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: theeb-arab-android-tv-debug
          path: clients/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
