name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run tests
        run: npm test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build API image
        run: docker build --target api --tag theeb-engine:ci .

      - name: Build worker image
        run: docker build --target worker --tag theeb-worker:ci .

      - name: Build migration image
        run: docker build --target migration --tag theeb-migration:ci .

  golden-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: theeb_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d theeb_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run bounded offline golden gates
        env:
          GATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/theeb_gate
          GATE_TIMEOUT_MS: 60000
          GATE_LOAD_OPERATIONS: 2000
          GATE_LOAD_CONCURRENCY: 25
          GATE_SOAK_CYCLES: 10000
        run: npm run gate:golden
      - name: Upload golden gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-gate-report
          path: artifacts/golden-gates/
          if-no-files-found: error
          retention-days: 14

  dart-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      THEEB_DELIVERY_API_BASE_URL: ${{ vars.THEEB_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - name: Analyze client contract
        run: dart analyze clients/dart/lib/theeb_api_contract.dart clients/dart/test/theeb_api_contract_test.dart
      - name: Run client contract tests
        run: dart clients/dart/test/theeb_api_contract_test.dart
      - name: Analyze mobile foundation
        run: dart analyze clients/dart/lib/http_theeb_transport.dart clients/dart/lib/theeb_client_config.dart clients/dart/lib/theeb_brand.dart clients/dart/test/mobile_foundation_test.dart clients/dart/tool/remote_smoke.dart
      - name: Run mobile foundation tests
        run: dart clients/dart/test/mobile_foundation_test.dart
      - name: Validate configured delivery API readiness
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        run: |
          READY_URL="${THEEB_DELIVERY_API_BASE_URL%/}/readyz"
          curl --fail --silent --show-error --max-time 10 "$READY_URL" | grep -q '"status":"ready"'
      - name: Run Dart client search smoke against delivery API
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        env:
          THEEB_API_BASE_URL: ${{ env.THEEB_DELIVERY_API_BASE_URL }}
        run: dart clients/dart/tool/remote_smoke.dart
      - name: Confirm delivery artifacts are intentionally disabled without a real API
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL == '' }}
        run: echo "::notice::THEEB_API_BASE_URL repository variable is not configured; no installable mobile artifacts will be produced."

  flutter-android:
    needs: dart-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THEEB_DELIVERY_API_BASE_URL: ${{ vars.THEEB_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        working-directory: clients/flutter
        run: flutter create --platforms=android --org com.theebarab --project-name theeb_arab .
      - name: Get Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: clients/flutter
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: clients/flutter
        run: flutter test
      - name: Build Android debug APK with verified API
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        working-directory: clients/flutter
        run: flutter build apk --debug --dart-define="THEEB_API_BASE_URL=$THEEB_DELIVERY_API_BASE_URL"
      - name: Validate Android artifact API configuration
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        run: |
          rm -rf /tmp/theeb-android && mkdir -p /tmp/theeb-android
          unzip -q clients/flutter/build/app/outputs/flutter-apk/app-debug.apk -d /tmp/theeb-android
          ! grep -aR -F 'https://example.invalid/' /tmp/theeb-android
          ! grep -aR -F 'http://127.0.0.1:8080/' /tmp/theeb-android
          ! grep -aR -F 'https://example.com/' /tmp/theeb-android
          grep -aR -F "$THEEB_DELIVERY_API_BASE_URL" /tmp/theeb-android >/dev/null
      - name: Upload Android debug APK
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theeb-arab-android-debug
          path: clients/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Skip Android artifact without verified API
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL == '' }}
        run: echo "::notice::Android compile checks passed, but installable APK generation is disabled until THEEB_API_BASE_URL is configured and reachable."

  flutter-android-tv:
    needs: dart-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THEEB_DELIVERY_API_BASE_URL: ${{ vars.THEEB_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        working-directory: clients/flutter
        run: flutter create --platforms=android --org com.theebarab --project-name theeb_arab .
      - name: Configure Android TV manifest
        working-directory: clients/flutter
        run: dart run tool/configure_android_tv.dart
      - name: Get Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get
      - name: Analyze Flutter TV app
        working-directory: clients/flutter
        run: flutter analyze
      - name: Run Flutter TV tests
        working-directory: clients/flutter
        run: flutter test
      - name: Build Android TV debug APK with verified API
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        working-directory: clients/flutter
        run: flutter build apk --debug --dart-define="THEEB_API_BASE_URL=$THEEB_DELIVERY_API_BASE_URL" --dart-define=THEEB_TARGET=tv
      - name: Validate Android TV artifact API configuration
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        run: |
          rm -rf /tmp/theeb-tv && mkdir -p /tmp/theeb-tv
          unzip -q clients/flutter/build/app/outputs/flutter-apk/app-debug.apk -d /tmp/theeb-tv
          ! grep -aR -F 'https://example.invalid/' /tmp/theeb-tv
          ! grep -aR -F 'http://127.0.0.1:8080/' /tmp/theeb-tv
          ! grep -aR -F 'https://example.com/' /tmp/theeb-tv
          grep -aR -F "$THEEB_DELIVERY_API_BASE_URL" /tmp/theeb-tv >/dev/null
      - name: Upload Android TV debug APK
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theeb-arab-android-tv-debug
          path: clients/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Skip Android TV artifact without verified API
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL == '' }}
        run: echo "::notice::Android TV compile checks passed, but installable APK generation is disabled until THEEB_API_BASE_URL is configured and reachable."

  flutter-ios:
    needs: dart-contract
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      THEEB_DELIVERY_API_BASE_URL: ${{ vars.THEEB_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform scaffold
        working-directory: clients/flutter
        run: flutter create --platforms=ios --org com.theebarab --project-name theeb_arab .
      - name: Get Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get
      - name: Analyze Flutter iOS app
        working-directory: clients/flutter
        run: flutter analyze
      - name: Run Flutter iOS tests
        working-directory: clients/flutter
        run: flutter test
      - name: Build unsigned iOS app with verified API
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        working-directory: clients/flutter
        run: flutter build ios --release --no-codesign --dart-define="THEEB_API_BASE_URL=$THEEB_DELIVERY_API_BASE_URL" --dart-define=THEEB_TARGET=ios
      - name: Validate iOS artifact API configuration
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        run: |
          ! grep -aR -F 'https://example.invalid/' clients/flutter/build/ios/iphoneos/Runner.app
          ! grep -aR -F 'http://127.0.0.1:8080/' clients/flutter/build/ios/iphoneos/Runner.app
          ! grep -aR -F 'https://example.com/' clients/flutter/build/ios/iphoneos/Runner.app
          grep -aR -F "$THEEB_DELIVERY_API_BASE_URL" clients/flutter/build/ios/iphoneos/Runner.app >/dev/null
      - name: Package unsigned IPA
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        working-directory: clients/flutter
        run: |
          mkdir -p build/ios/unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -qry ../theeb-arab-ios-unsigned.ipa Payload
      - name: Upload unsigned iOS IPA
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theeb-arab-ios-unsigned
          path: clients/flutter/build/ios/theeb-arab-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Skip iOS artifact without verified API
        if: ${{ env.THEEB_DELIVERY_API_BASE_URL == '' }}
        run: echo "::notice::iOS analyze/tests passed, but unsigned IPA generation is disabled until THEEB_API_BASE_URL is configured and reachable."
