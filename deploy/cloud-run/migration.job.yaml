apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: theeb-db-migrate
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: THEEB_MIGRATION_SERVICE_ACCOUNT
          maxRetries: 0
          timeoutSeconds: "600"
          containers:
            - name: migration
              image: THEEB_MIGRATION_IMAGE
              env:
                - name: NODE_ENV
                  value: production
                - name: DATABASE_DRIVER
                  value: postgres
                - name: PGSSLMODE
                  value: verify-full
                - name: PG_CONNECT_TIMEOUT_MS
                  value: "10000"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: theeb-database-url
                      key: latest
